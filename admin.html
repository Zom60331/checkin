<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e1730">
<title>場次管理</title>
<style>
  /* 色票與簽到頁、控制台一致 */
  :root {
    --bg: #1e1730;
    --card: #2b2140;
    --card-2: #332845;
    --ink: #f4eefb;
    --ink-soft: #b9aecb;
    --brand: #7c62bd;
    --brand-dark: #6d56a6;
    --gold: #e0c48f;
    --success: #5ac98a;
    --fail: #f0857a;
    --line: rgba(255, 255, 255, .16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.4;
    font-size: 16px;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 12px 16px 40px; }
  .hidden { display: none !important; }

  /* ── 登入 ── */
  .login { max-width: 380px; margin: 60px auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .login h1 { font-size: 22px; margin: 0 0 4px; }
  .login p { color: var(--ink-soft); font-size: 15px; margin: 0 0 18px; }

  label { display: block; font-size: 14px; color: var(--ink-soft); margin: 12px 0 4px; }
  input {
    width: 100%; padding: 11px 12px; font-size: 17px;
    border: 1px solid var(--line); border-radius: 9px;
    background: #241b36; color: var(--ink); font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--brand); }

  button, .btn {
    font-family: inherit; font-size: 15px; font-weight: 700;
    border: none; border-radius: 9px; padding: 9px 14px;
    background: var(--brand); color: #fff; cursor: pointer;
    text-decoration: none; display: inline-block; line-height: 1.35;
  }
  button:active { background: var(--brand-dark); }
  button:disabled { background: #5b5470; cursor: not-allowed; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 600; }
  button.block { width: 100%; padding: 14px; font-size: 18px; margin-top: 18px; }

  /* ── 頂列 ── */
  .topline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .topline h1 { font-size: 22px; margin: 0; flex: 1 1 auto; }

  /* ── 場次卡片 ── */
  .event { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .event.off { opacity: .72; }
  .event .head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .event .name { font-size: 19px; font-weight: 800; margin-right: auto; }
  .event .meta { font-size: 14px; color: var(--ink-soft); margin-top: 2px; word-break: break-all; }
  .event .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: 13px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--line); color: var(--ink-soft); white-space: nowrap; }
  .tag.ok { color: var(--success); border-color: rgba(90,201,138,.45); }
  .tag.warn { color: var(--gold); border-color: rgba(224,196,143,.45); }
  .tag.bad { color: var(--fail); border-color: rgba(240,133,122,.45); }

  /* ── 檢查結果 ── */
  .check { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .check .verdict { font-weight: 800; margin-bottom: 6px; }
  .check .verdict.ok { color: var(--success); }
  .check .verdict.warn { color: var(--gold); }
  .check .verdict.bad { color: var(--fail); }
  .check ul { list-style: none; margin: 0; padding: 0; }
  .check li { display: flex; gap: 8px; font-size: 15px; padding: 3px 0; }
  .check li .ic { flex: 0 0 1.4em; text-align: center; }
  .check li.error { color: var(--fail); }
  .check li.warn { color: var(--gold); }
  .check li.info { color: var(--ink-soft); }

  .empty { text-align: center; color: var(--ink-soft); padding: 30px 0; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--card-2); border: 1px solid var(--line); color: var(--ink);
    padding: 12px 18px; border-radius: 10px; font-size: 16px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 50; max-width: 90vw;
  }
  .toast.bad { border-color: rgba(240,133,122,.5); }

  /* ── QR 對話框 ── */
  .mask { position: fixed; inset: 0; background: rgba(10,6,20,.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 40; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; max-height: 100%; overflow-y: auto; }
  .modal h3 { margin: 0 0 4px; font-size: 20px; }
  .modal .sub { color: var(--ink-soft); font-size: 14px; margin-bottom: 12px; word-break: break-all; }
  .modal canvas { display: block; width: 100%; height: auto; border-radius: 10px; background: #fff; }
  .modal .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .modal .btns > * { flex: 1 1 auto; text-align: center; }
</style>
</head>
<body>

<!-- ── 登入 ── -->
<div class="login" id="loginBox">
  <h1>場次管理</h1>
  <p>開場前檢查名單、預覽簽到頁、產生 QR code</p>
  <label for="pw">管理密碼</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button class="block" id="loginBtn">進入</button>
  <p id="loginMsg" style="margin-top:12px;color:var(--fail)"></p>
</div>

<!-- ── 主畫面 ── -->
<div class="wrap hidden" id="main">
  <div class="topline">
    <h1>場次管理</h1>
    <a class="btn ghost" id="masterLink" target="_blank" rel="noopener">開啟主控表</a>
    <button class="ghost" id="refreshBtn">重新整理</button>
    <button class="ghost" id="logoutBtn">登出</button>
  </div>
  <div id="list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
        integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1"
        crossorigin="anonymous"></script>
<script>
// 與簽到頁、控制台同一個 Apps Script /exec 網址
var API = 'https://script.google.com/macros/s/AKfycbwwoZnAoiftITok6hGpFkKGzaRX4WqshVEbbHL1d_DwRKrmm3LHBDayZfaDtc0aO-In/exec';

// QR 一律指向正式簽到頁，即使管理頁是在本機開的
var SIGNIN_BASE = 'https://zom60331.github.io/checkin/';

var state = { pass: '', events: [] };
var $ = function (id) { return document.getElementById(id); };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function signinUrl(code) {
  return SIGNIN_BASE + '?e=' + encodeURIComponent(code);
}

// 示範模式：網址加 ?demo=1 就用假資料跑，不連後端
var DEMO = new URLSearchParams(location.search).get('demo') === '1';

function demoApi(payload) {
  var data = {
    adminEvents: { status: 'success', masterUrl: 'https://docs.google.com/spreadsheets/d/demo/edit', events: [
      { code: '20261015-kd', name: '新手實戰班 · 台北場', date: '2026/10/15', enabled: true, sheetId: 'demo1', sheetName: '名單總表', logSheetId: '', duplicate: false },
      { code: '20261020-online', name: '新手實戰班 · 線上場', date: '2026/10/20', enabled: false, sheetId: 'demo2', sheetName: '名單總表', logSheetId: 'demo3', duplicate: false },
      { code: '範例-請改', name: '範例場次', date: '2026/08/17', enabled: false, sheetId: '貼上名單試算表ID', sheetName: '名單總表', logSheetId: '', duplicate: false }
    ]},
    adminCheck: {
      '20261015-kd': { status: 'success', errors: 0, warnings: 2, items: [
        { level: 'ok', text: '已啟用' },
        { level: 'ok', text: '活動日期 2026/10/15（13 天後）' },
        { level: 'ok', text: '名單：「1015 台北場名單」／分頁「名單總表」' },
        { level: 'ok', text: '認得的欄位：「手機」、「姓名」、「訂單編號」、「報名人數」、「交易狀態」' },
        { level: 'ok', text: '共 128 筆：成功單 124 筆（應到 139 人）、異常單 4 筆' },
        { level: 'info', text: '異常單的交易狀態：退款 3、失敗 1' },
        { level: 'warn', text: '2 筆沒有電話，無法自助簽到，需工作人員處理：王小明（第 15 列）、林小華（第 88 列）' },
        { level: 'warn', text: '1 支電話重複出現（可能是重複報名）。自助簽到會卡住，同一支電話也只能簽到一次，需工作人員處理：陳大文（第 40 列）、陳大文（第 41 列）' },
        { level: 'info', text: '3 組末四碼相同：這些學員輸入末四碼後，會被要求改輸入完整號碼（正常流程）' },
        { level: 'ok', text: '簽到紀錄寫進主控表，第一位簽到時自動建立分頁' }
      ]},
      '20261020-online': { status: 'success', errors: 0, warnings: 1, items: [
        { level: 'warn', text: '未啟用：學員簽到會被擋，控制台也看不到這場' },
        { level: 'ok', text: '活動日期 2026/10/20（18 天後）' },
        { level: 'ok', text: '名單：「1020 線上場名單」／分頁「名單總表」' },
        { level: 'ok', text: '共 56 筆：成功單 56 筆（應到 56 人）、異常單 0 筆' },
        { level: 'ok', text: '簽到紀錄寫進「王老師 簽到紀錄」，第一位簽到時自動建立分頁' }
      ]},
      '範例-請改': { status: 'success', errors: 1, warnings: 2, items: [
        { level: 'warn', text: '場次代碼含英數字、-、_ 以外的字元，放進網址可能出問題' },
        { level: 'warn', text: '未啟用：學員簽到會被擋，控制台也看不到這場' },
        { level: 'error', text: '打不開名單試算表：ID 有誤，或名單沒有分享給部署帳號（Apps Script 擁有者）' }
      ]}
    }
  };
  return new Promise(function (resolve) {
    setTimeout(function () {
      if (payload.action === 'adminCheck') resolve(data.adminCheck[payload.event]);
      else resolve(data[payload.action] || { status: 'error', message: '示範模式不支援這個動作' });
    }, 400);
  });
}

function api(payload) {
  if (DEMO) return demoApi(payload);
  payload.pass = state.pass;
  return fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function (r) { return r.json(); });
}

function toast(msg, kind) {
  var el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 2600);
}

// ---------- 登入 ----------
function doLogin() {
  var pw = $('pw').value.trim();
  if (!pw) { $('loginMsg').textContent = '請輸入管理密碼'; return; }
  state.pass = pw;
  $('loginBtn').disabled = true;
  $('loginMsg').textContent = '';

  api({ action: 'adminEvents' })
    .then(function (res) {
      $('loginBtn').disabled = false;
      if (res.status !== 'success') {
        $('loginMsg').textContent = res.message || '登入失敗';
        return;
      }
      try { localStorage.setItem('admin_pass', pw); } catch (e) {}
      $('loginBox').classList.add('hidden');
      $('main').classList.remove('hidden');
      showEvents(res);
    })
    .catch(function () {
      $('loginBtn').disabled = false;
      $('loginMsg').textContent = '連線失敗，請確認網路';
    });
}

function loadEvents() {
  $('list').innerHTML = '<div class="empty">載入中…</div>';
  return api({ action: 'adminEvents' }).then(function (res) {
    if (res.status !== 'success') { $('list').innerHTML = '<div class="empty">' + esc(res.message) + '</div>'; return; }
    showEvents(res);
  }).catch(function () {
    $('list').innerHTML = '<div class="empty">連線失敗，請按重新整理</div>';
  });
}

// ---------- 場次列表 ----------
function showEvents(res) {
  if (res.masterUrl) $('masterLink').href = res.masterUrl;
  $('masterLink').classList.toggle('hidden', !res.masterUrl);

  // 主控表越下面的列通常越新，反過來排讓新場次在最上面
  state.events = (res.events || []).slice().reverse();
  if (state.events.length === 0) {
    $('list').innerHTML = '<div class="empty">主控表「場次」分頁還沒有任何場次</div>';
    return;
  }

  $('list').innerHTML = state.events.map(function (ev, i) {
    var tags = ev.enabled ? '<span class="tag ok">啟用中</span>' : '<span class="tag">未啟用</span>';
    if (ev.duplicate) tags += '<span class="tag bad">代碼重複</span>';
    return '<div class="event' + (ev.enabled ? '' : ' off') + '" data-i="' + i + '">' +
      '<div class="head"><div class="name">' + esc(ev.name || ev.code) + '</div>' + tags + '</div>' +
      '<div class="meta">' + esc(ev.code) + (ev.date ? ' ｜ ' + esc(ev.date) : '') + '</div>' +
      '<div class="acts">' +
        '<button data-act="check">檢查</button>' +
        '<a class="btn ghost" href="' + esc(signinUrl(ev.code)) + '" target="_blank" rel="noopener">預覽簽到頁</a>' +
        '<button class="ghost" data-act="qr">QR code</button>' +
      '</div>' +
      '<div class="check hidden"></div>' +
    '</div>';
  }).join('');
}

var LEVEL_ICON = { ok: '✅', info: 'ℹ️', warn: '⚠️', error: '❌' };

function runCheck(card, ev) {
  var box = card.querySelector('.check');
  var btn = card.querySelector('[data-act="check"]');
  box.classList.remove('hidden');
  box.innerHTML = '<div class="verdict">檢查中…</div>';
  btn.disabled = true;

  api({ action: 'adminCheck', event: ev.code }).then(function (res) {
    btn.disabled = false;
    btn.textContent = '重新檢查';
    if (res.status !== 'success') {
      box.innerHTML = '<div class="verdict bad">' + esc(res.message || '檢查失敗') + '</div>';
      return;
    }
    var verdict = res.errors > 0
      ? '<div class="verdict bad">有 ' + res.errors + ' 個問題要先修，這場現在無法正常簽到</div>'
      : res.warnings > 0
        ? '<div class="verdict warn">沒有阻斷簽到的問題，但有 ' + res.warnings + ' 點要留意</div>'
        : '<div class="verdict ok">沒有問題，可以開場</div>';
    var t = new Date();
    box.innerHTML = verdict + '<ul>' + res.items.map(function (it) {
      return '<li class="' + esc(it.level) + '"><span class="ic">' + (LEVEL_ICON[it.level] || '') + '</span><span>' + esc(it.text) + '</span></li>';
    }).join('') + '</ul>' +
      '<div class="meta" style="margin-top:6px;font-size:13px;color:var(--ink-soft)">檢查於 ' + t.toTimeString().slice(0, 8) + '</div>';
  }).catch(function () {
    btn.disabled = false;
    box.innerHTML = '<div class="verdict bad">連線失敗，請再按一次</div>';
  });
}

// ---------- QR code ----------
function drawQr(canvas, text) {
  var qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  var count = qr.getModuleCount();
  var quiet = 4;                                   // QR 規格要求四格留白
  var cell = Math.floor(1200 / (count + quiet * 2)); // 輸出約 1200px，印刷夠用
  var size = cell * (count + quiet * 2);
  canvas.width = size;
  canvas.height = size;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000000';
  for (var r = 0; r < count; r++) {
    for (var c = 0; c < count; c++) {
      if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
    }
  }
}

function showQr(ev) {
  if (typeof qrcode !== 'function') { toast('QR 元件載入失敗，請重新整理頁面', 'bad'); return; }
  var url = signinUrl(ev.code);
  var mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = '<div class="modal"><h3>' + esc(ev.name || ev.code) + '</h3>' +
    '<div class="sub">' + esc(url) + '</div>' +
    '<canvas></canvas>' +
    (ev.enabled ? '' : '<div class="sub" style="color:var(--gold);margin:10px 0 0">這場還沒啟用，學員現在掃碼會被擋</div>') +
    '<div class="btns">' +
      '<button data-x="download">下載 PNG</button>' +
      '<button class="ghost" data-x="copy">複製網址</button>' +
      '<button class="ghost" data-x="close">關閉</button>' +
    '</div></div>';
  document.body.appendChild(mask);

  var canvas = mask.querySelector('canvas');
  drawQr(canvas, url);

  mask.addEventListener('click', function (e) {
    var x = e.target.dataset ? e.target.dataset.x : '';
    if (e.target === mask || x === 'close') { mask.remove(); return; }
    if (x === 'download') {
      var a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'QR_' + ev.code + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    if (x === 'copy') {
      navigator.clipboard.writeText(url).then(function () { toast('已複製網址'); },
        function () { toast('無法複製，請手動選取網址', 'bad'); });
    }
  });
}

// ---------- 事件 ----------
$('loginBtn').addEventListener('click', doLogin);
$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
$('refreshBtn').addEventListener('click', loadEvents);
$('logoutBtn').addEventListener('click', function () {
  try { localStorage.removeItem('admin_pass'); } catch (e) {}
  location.reload();
});

$('list').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-act]');
  if (!btn) return;
  var card = btn.closest('.event');
  var ev = state.events[+card.dataset.i];
  if (btn.dataset.act === 'check') runCheck(card, ev);
  if (btn.dataset.act === 'qr') showQr(ev);
});

if (DEMO) {
  document.title = '場次管理（示範）';
  $('pw').value = 'demo';
  doLogin();
} else {
  // 記住密碼：只有開場次的人用這頁，重開不用重打
  try {
    var saved = localStorage.getItem('admin_pass');
    if (saved) { $('pw').value = saved; doLogin(); }
  } catch (e) {}
}
</script>
</body>
</html>
